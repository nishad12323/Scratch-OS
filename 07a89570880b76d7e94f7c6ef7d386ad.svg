<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="360" viewBox="0,0,480,360"><g transform=""><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M0,360v-360h480v360z" fill="#ffffff" stroke-width="0"/><path d="M86.88444,154.12658v-27h315.65508v27z" fill="#f2f2f2" stroke-width="0"/><text transform="translate(86.88444,36.67872) scale(0.59988,0.59988)" font-size="40" xml:space="preserve" fill="#9966ff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Reading and Running Files</tspan></text><text transform="translate(86.88444,57.15844) scale(0.38371,0.38371)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">SLCT returns 3 values: #PULL, #FNME, and</tspan><tspan x="0" dy="46.150000000000006px">#FIDX. #PULL is the content of the selected</tspan><tspan x="0" dy="46.150000000000006px">file, so to print the contents of a file to the</tspan><tspan x="0" dy="46.150000000000006px">panel, you would do:</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">    SLCT myfile:txt;ECHO #PULL</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">💡#FNME stands for filename, and #FIDX</tspan><tspan x="0" dy="46.150000000000006px">    stands for file index.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">To run a file as code, use RUNF. This</tspan><tspan x="0" dy="46.150000000000006px">function takes a parameter: -gui, to hide or</tspan><tspan x="0" dy="46.150000000000006px">show the console panel. Essentially, if the</tspan><tspan x="0" dy="46.150000000000006px">app is a GUI (graphical user interface) app,</tspan><tspan x="0" dy="46.150000000000006px">hide the console window. However, it's</tspan><tspan x="0" dy="46.150000000000006px">always a good practice to declare SHOW if</tspan><tspan x="0" dy="46.150000000000006px">printing in the console in your app.</tspan></text></g></g></svg>