<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="360" viewBox="0,0,480,360"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M0,360v-360h480v360z" fill="#ffffff" stroke-width="0"/><path d="M86.88444,154.12658v-27h315.65508v27z" fill="#f2f2f2" stroke-width="0"/><path d="M86.88444,313.50053v-27h315.65508v27z" fill="#f2f2f2" stroke-width="0"/><text transform="translate(86.88444,57.15844) scale(0.38371,0.38371)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">To create a file, use NEWF [filename]. This</tspan><tspan x="0" dy="46.15px">creates a file and selects it. This also</tspan><tspan x="0" dy="46.15px">returns the same values as SLCT. For</tspan><tspan x="0" dy="46.15px">example, to create a :txt file, you'd do:</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">    NEWF mynewtextfile:txt</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">In addition to making :txt files, you can</tspan><tspan x="0" dy="46.15px">make :app files, too.</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">To erase all contents and write to a file, use</tspan><tspan x="0" dy="46.15px">EDIT. To append to a file (write at the end),</tspan><tspan x="0" dy="46.15px">you could do:</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">    EDIT #PULL This will be appended.</tspan></text><text transform="translate(86.88444,36.67872) scale(0.59988,0.59988)" font-size="40" xml:space="preserve" fill="#9966ff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Writing and Creating Files</tspan></text></g></svg>