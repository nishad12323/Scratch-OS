<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="575.07508" height="432.43243" viewBox="0,0,575.07508,432.43243"><g transform="translate(43.033,28.45843)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M-43.033,403.974v-432.43243h575.07508v432.43243z" fill="#000000" stroke-width="0"/><text transform="translate(160.42304,68.11596) scale(0.67633,0.67633)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Tablet Mode</tspan></text><text transform="translate(82.46312,93.50264) scale(0.30328,0.30328)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">In tablet mode, your device behaves as if it was a</tspan><tspan x="0" dy="46.150000000000006px">tablet. To go home, swipe up from the bottom, and</tspan><tspan x="0" dy="46.150000000000006px">swipe down to open App Drawer. To go back, swipe</tspan><tspan x="0" dy="46.150000000000006px">left from the right. This also closes App Drawer.</tspan></text></g></g></svg>