<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="360" viewBox="0,0,480,360"><g transform=""><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M0,360v-360h480v360z" fill="#ffffff" stroke-width="0"/><text transform="translate(86.88444,36.67872) scale(0.59988,0.59988)" font-size="40" xml:space="preserve" fill="#9966ff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">File Handling</tspan></text><text transform="translate(86.88444,57.15844) scale(0.38371,0.38371)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">File handling can be an important part</tspan><tspan x="0" dy="46.15px">of your application. Scratch OS has lots of</tspan><tspan x="0" dy="46.15px">support for opening, reading, and</tspan><tspan x="0" dy="46.15px">writing to files.</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">To list all files, use RDIR or READ. This will</tspan><tspan x="0" dy="46.15px">echo all of the files along with their type</tspan><tspan x="0" dy="46.15px">and the approx. amount of bytes they</tspan><tspan x="0" dy="46.15px">take up.</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">When you want to make changes or read</tspan><tspan x="0" dy="46.15px">the content of a file, use SLCT [filename].</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">💡 SLCT stands for "select."</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">To read the contents, move on to the next</tspan><tspan x="0" dy="46.15px">slide.</tspan></text></g></g></svg>